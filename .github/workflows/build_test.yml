name: Build and test the app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore ./05-SeleniumIDE/2-SeleniumIDE/SeleniumIDE/SeleniumIDE.csproj
    - name: Build
      run: dotnet build --no-restore ./05-SeleniumIDE/2-SeleniumIDE/SeleniumIDE/SeleniumIDE.csproj
    - name: Run Selenium UI tests
      run: dotnet test ./05-SeleniumIDE/2-SeleniumIDE/SeleniumIDE/SeleniumIDE.csproj --no-build --verbosity normal
